<style>
/* Layout: a deep-teal band with an eight-point star lattice, four game tabs under it, and one play board at a time (tiles tray + drop slots). */
:root{
  --bg:#EDF2F0; --tile:#FFFFFF; --card:#F8FBFA; --ink:#11302E; --muted:#4B6865;
  --line:#CBDAD6; --line-strong:#9DB8B2; --slot:#E1EBE8;
  --accent:#0E6B63; --accent-soft:#D3EBE7; --on-accent:#FFFFFF;
  --gold:#F0B84A; --gold-ink:#2B1B00; --gold-soft:#F6D58E;
  --ok:#1E8A4C; --ok-bg:#DDF2E4; --ok-ink:#17703D;
  --bad:#C4452D; --bad-ink:#A8341E;
  --hero:#0C4A45; --hero-ink:#EAF6F3; --hero-line:rgba(255,255,255,.13);
  --focus:#1F5FD1;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-ar:'Amiri Quran','Scheherazade New','Traditional Arabic',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A2220; --tile:#16403B; --card:#102E2B; --ink:#E6F1EE; --muted:#9BB8B3;
    --line:#24504A; --line-strong:#3C7169; --slot:#0C2724;
    --accent:#4CC3B3; --accent-soft:#16423D; --on-accent:#06201D;
    --gold:#E3A93A; --gold-ink:#2B1B00; --gold-soft:#F2CC7C;
    --ok:#4CC27D; --ok-bg:#15402A; --ok-ink:#7FDDA3;
    --bad:#FF8A70; --bad-ink:#FFA692;
    --hero:#073733; --hero-ink:#EAF6F3; --hero-line:rgba(255,255,255,.1);
    --focus:#8DB4FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A2220; --tile:#16403B; --card:#102E2B; --ink:#E6F1EE; --muted:#9BB8B3;
  --line:#24504A; --line-strong:#3C7169; --slot:#0C2724;
  --accent:#4CC3B3; --accent-soft:#16423D; --on-accent:#06201D;
  --gold:#E3A93A; --gold-ink:#2B1B00; --gold-soft:#F2CC7C;
  --ok:#4CC27D; --ok-bg:#15402A; --ok-ink:#7FDDA3;
  --bad:#FF8A70; --bad-ink:#FFA692;
  --hero:#073733; --hero-ink:#EAF6F3; --hero-line:rgba(255,255,255,.1);
  --focus:#8DB4FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero{position:relative;background:var(--hero);color:var(--hero-ink);overflow:hidden}
.lattice{position:absolute;inset:0;width:100%;height:100%;color:var(--hero-line)}
.hero .wrap{position:relative;display:flex;flex-direction:column;gap:16px;padding-block:22px 20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.eyebrow{margin:0 0 2px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,2.9rem);line-height:1.05;text-wrap:balance}
.arname{margin:0;font-family:var(--f-ar);font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.2;color:var(--gold-soft)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.pts{display:inline-flex;gap:8px;align-items:baseline;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:4px 16px;font-weight:700}
.pts b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.pts.pop{animation:pop .4s}
.lab2{font-size:.9rem;opacity:.9}
.seg{display:inline-flex;border:2px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:.9rem;background:transparent;color:var(--hero-ink);border:0;padding:6px 14px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero)}

main{padding-block:20px 32px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.tab{position:relative;font:inherit;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab b{font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.tab span{font-size:.85rem;color:var(--muted)}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab .tick{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--ok);color:#fff;border-radius:999px;padding:1px 8px}
.tab .tick[hidden]{display:none}

.board{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
.board h2{margin:0 0 4px;font-family:var(--f-display);font-size:1.6rem;line-height:1.2}
.help{margin:0 0 16px;color:var(--muted);max-width:65ch}
.lab{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.col{min-width:0}

.chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--tile);color:var(--ink);border:2px solid var(--line-strong);border-bottom-width:5px;border-radius:12px;padding:4px 14px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-family:var(--f-ar);font-size:1.7rem;line-height:1.8;direction:rtl;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip.verse{font-size:1.5rem;width:100%}
.chip.text{font-family:var(--f-body);font-size:1rem;line-height:1.35;direction:ltr;text-align:left;justify-content:flex-start;padding:10px 14px;width:100%}
.chip.selected{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.chip.dragging{opacity:.3}
.chip.locked{cursor:default;border-color:var(--ok);background:var(--ok-bg)}
.chip.locked:hover{transform:none}
.chip.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 14px 28px rgba(0,0,0,.3);opacity:.97}
.chip:focus-visible,.zone:focus-visible,.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.pick button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.pool{display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:12px;min-height:76px;background:var(--slot);border:2px dashed var(--line-strong);border-radius:14px}
.pool.stack{flex-direction:column;flex-wrap:nowrap}
.pool.stack .chip{width:100%}
.slot{flex:1;display:flex;align-items:center;justify-content:center;min-height:64px;min-width:5rem;padding:4px;background:var(--slot);border:2px dashed var(--line-strong);border-radius:14px}
.slot .chip{width:100%}
.slot.fit{flex:0 0 auto}
.slot.fit .chip{width:auto}
.slot:has(.chip){border-style:solid}
.zone.over{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slot.ok{border-style:solid;border-color:var(--ok)}
.slot.bad{border-style:solid;border-color:var(--bad);animation:shake .32s}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-variant-numeric:tabular-nums}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
.vbox{display:flex;align-items:center;justify-content:flex-end;padding:8px 14px;background:var(--tile);border:2px solid var(--line);border-radius:14px;font-family:var(--f-ar);font-size:1.45rem;line-height:1.8;direction:rtl;min-width:0}
.mrow .slot{min-height:72px}

.sentence{display:flex;flex-wrap:wrap;align-items:center;direction:rtl;gap:6px 14px;padding:18px;margin-bottom:16px;background:var(--tile);border:2px solid var(--line);border-radius:14px;font-family:var(--f-ar);font-size:clamp(1.8rem,5vw,2.5rem);line-height:2}
.sentence .slot{min-width:7.5rem}
.mean{margin:0 0 16px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--tile);border-radius:0 10px 10px 0;max-width:65ch}
.mean small{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dots{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.dots i{width:30px;height:6px;border-radius:3px;background:var(--line-strong)}
.dots i.on{background:var(--accent)}
.dots span{margin-left:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pick button{position:relative;font:inherit;font-weight:700;font-size:.9rem;background:var(--tile);color:var(--ink);border:2px solid var(--line-strong);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:38px}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pick button.done::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--ok)}
.build-slots{display:flex;flex-wrap:wrap;direction:rtl;gap:10px;margin-bottom:16px}

.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font:inherit;font-weight:700;border:2px solid var(--accent);border-radius:999px;padding:10px 22px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[hidden]{display:none}
.msg{min-height:1.6em;margin:12px 0 0;font-weight:700}
.msg.ok{color:var(--ok-ink)}
.msg.bad{color:var(--bad-ink)}
.result{padding:24px;text-align:center;background:var(--tile);border:2px solid var(--line);border-radius:14px}
.result p{margin:6px 0}
.result .big{font-family:var(--f-display);font-size:2rem;font-weight:800}
.foot{margin:20px 0 0;font-size:.85rem;color:var(--muted);max-width:70ch}

@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.12)}}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}.board{padding:16px}.vbox{justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.dragging-now{cursor:grabbing}
body.dragging-now .chip{cursor:grabbing}
</style>

<header class="hero">
  <svg class="lattice" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="star" width="48" height="48" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="currentColor" stroke-width="1">
          <rect x="10" y="10" width="28" height="28"/>
          <rect x="10" y="10" width="28" height="28" transform="rotate(45 24 24)"/>
          <circle cx="24" cy="24" r="4"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#star)"/>
  </svg>
  <div class="wrap">
    <div class="top">
      <div>
        <p class="eyebrow">Surah 1 · 7 ayat · Makkiyyah</p>
        <h1>Fatihah Games</h1>
      </div>
      <p class="arname" lang="ar" dir="rtl">الفاتحة</p>
    </div>
    <div class="ctl">
      <span class="pts" id="ptsbox">Points <b id="pts">0</b></span>
      <span class="lab2">Meanings in</span>
      <div class="seg" role="group" aria-label="Meaning language">
        <button type="button" id="l-en" aria-pressed="true">English</button>
        <button type="button" id="l-ms" aria-pressed="false">Bahasa Melayu</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" aria-label="Games" id="tabs"></nav>
  <section class="board" id="board" aria-live="off"></section>
  <p class="foot">Ayah numbers follow the mushaf common in Malaysia, where the Bismillah is ayah 1. The meanings are short renderings written for learners. Check your recitation with a qualified teacher.</p>
</main>

<script>
(function(){
'use strict';

var V=[
 {n:1,ar:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ',en:'In the name of Allah, the Most Gracious, the Most Merciful.',ms:'Dengan nama Allah Yang Maha Pemurah lagi Maha Mengasihani.'},
 {n:2,ar:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ',en:'All praise is for Allah, Lord of all the worlds.',ms:'Segala puji bagi Allah, Tuhan sekalian alam.'},
 {n:3,ar:'الرَّحْمَٰنِ الرَّحِيمِ',en:'The Most Gracious, the Most Merciful.',ms:'Yang Maha Pemurah lagi Maha Mengasihani.'},
 {n:4,ar:'مَالِكِ يَوْمِ الدِّينِ',en:'Master of the Day of Judgment.',ms:'Yang Menguasai hari pembalasan.'},
 {n:5,ar:'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ',en:'You alone we worship, and You alone we ask for help.',ms:'Hanya Engkau yang kami sembah, dan hanya kepada Engkau kami memohon pertolongan.'},
 {n:6,ar:'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',en:'Guide us to the straight path.',ms:'Tunjukilah kami jalan yang lurus.'},
 {n:7,ar:'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',en:'The path of those You have blessed, not of those who earned anger, and not of those who went astray.',ms:'Iaitu jalan orang-orang yang Engkau kurniakan nikmat, bukan jalan mereka yang dimurkai, dan bukan jalan mereka yang sesat.'}
];
V.forEach(function(v){v.w=v.ar.split(' ');});
var ROUNDS=[[2,0],[2,3],[4,1],[5,1],[6,2],[7,8]];

var S={game:'order',lang:'en',points:0,done:{order:false,fill:false,match:false,build:false},
  g2:{i:0,miss:0,pts:0,fin:false},g4:{n:5,done:{}}};
try{var sv=localStorage.getItem('fatihah-lang'); if(sv==='ms'||sv==='en')S.lang=sv;}catch(e){}

var $=function(s){return document.querySelector(s);};

function byN(n){return V.filter(function(v){return v.n===n;})[0];}
function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
function shuffleDiff(a){if(a.length<2)return a.slice(); var s; do{s=shuffle(a);}while(s.every(function(x,i){return x===a[i];})); return s;}

}

  var box=$('#ptsbox'); box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}
function lockSlots(slots){slots.forEach(function(s){var c=s.querySelector('.chip'); if(c)c.classList.add('locked'); s.classList.add('ok'); s.tabIndex=-1;});}
function emptyCount(slots){return slots.filter(function(s){return !s.querySelector('.chip');}).length;}
function markSlots(slots,test){var right=0; slots.forEach(function(s,i){var c=s.querySelector('.chip'); var ok=test(c,s,i); s.classList.add(ok?'ok':'bad'); if(ok)right++;}); return right;}
function pointsFor(tries,table){return table[Math.min(tries,table.length)-1];}

/* ---------- drag, drop and tap engine ---------- */
var sel=null, drag=null, ghost=null, scrollTimer=null, lastY=0, suppress=false, busy=false;

function clearSel(){if(sel){sel.classList.remove('selected'); sel=null;}}
function clearMarks(){document.querySelectorAll('#board .slot.ok,#board .slot.bad').forEach(function(s){s.classList.remove('ok','bad');});}
function place(c,zone){
  var from=c.parentElement;
  clearSel();
  if(!zone||zone===from)return;
  if(zone.classList.contains('slot')){
    var occ=zone.querySelector('.chip');
    if(occ&&occ.classList.contains('locked'))return;
    if(occ)from.appendChild(occ);
  }
  zone.appendChild(c);
  clearMarks();
  if(S.onchange)S.onchange(c,zone);
}
function zoneAt(x,y){var t=document.elementFromPoint(x,y); return t?t.closest('#board .slot,#board .pool'):null;}

document.addEventListener('pointerdown',function(e){
  if(busy)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var c=e.target.closest&&e.target.closest('#board .chip');
  if(!c||c.classList.contains('locked'))return;
  drag={c:c,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,ox:0,oy:0};
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    var r=drag.c.getBoundingClientRect();
    ghost=drag.c.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('selected'); ghost.style.width=r.width+'px'; ghost.removeAttribute('tabindex');
    document.body.appendChild(ghost);
    drag.ox=e.clientX-r.left; drag.oy=e.clientY-r.top; drag.on=true;
    clearSel(); drag.c.classList.add('dragging'); document.body.classList.add('dragging-now');
    scrollTimer=setInterval(function(){
      if(lastY<70)window.scrollBy(0,-14); else if(lastY>window.innerHeight-70)window.scrollBy(0,14);
    },16);
  }
  lastY=e.clientY;
  ghost.style.transform='translate('+(e.clientX-drag.ox)+'px,'+(e.clientY-drag.oy)+'px) rotate(-2deg)';
  document.querySelectorAll('#board .over').forEach(function(z){z.classList.remove('over');});
  var z=zoneAt(e.clientX,e.clientY); if(z)z.classList.add('over');
  e.preventDefault();
},{passive:false});
function endDrag(){
  if(scrollTimer){clearInterval(scrollTimer); scrollTimer=null;}
  if(ghost){ghost.remove(); ghost=null;}
  document.body.classList.remove('dragging-now');
  document.querySelectorAll('#board .over').forEach(function(z){z.classList.remove('over');});
  if(drag&&drag.c)drag.c.classList.remove('dragging');
}
document.addEventListener('pointerup',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  if(drag.on){

});

    if(sel&&sel!==c&&c.parentElement.classList.contains('slot')){place(sel,c.parentElement); return;}

    clearSel(); sel=c; c.classList.add('selected'); return;
  }
  if(z&&sel)place(sel,z);

  if(t.classList.contains('chip')||t.classList.contains('slot')){e.preventDefault(); t.click();}
});

var GAMES={

order:{name:'Order the verses',sub:'Put 7 verses in order',build:function(b){
  var f=scaffold(b,'Order the verses','Drag each verse tile to its number, from 1 to 7. You can also tap a tile, then tap a number.');
  f.stage.classList.add('two');
  var left=el('div','col'); left.appendChild(el('p','lab','Verse tiles'));
  var pool=el('div','zone pool stack');
  shuffleDiff(V.map(function(v){return v.n;})).forEach(function(n){pool.appendChild(chip(byN(n).ar,{ar:1,k:n,cls:'verse'}));});
  left.appendChild(pool);
  var right=el('div','col'); right.appendChild(el('p','lab','Your order'));
  var slots=[];
  V.forEach(function(v){
    var r=el('div','row'); r.appendChild(el('span','num',v.n));
    var s=el('div','zone slot'); s.dataset.exp=v.n; s.tabIndex=0; s.setAttribute('aria-label','Position '+v.n);
    slots.push(s); r.appendChild(s); right.appendChild(r);
  });
  f.stage.appendChild(left); f.stage.appendChild(right);
  var tries=0, won=false;
  f.bar.appendChild(btn('Check order','primary',function(){
    if(won)return;
    if(emptyCount(slots)){say(f.msg,'Fill every number first.','bad'); return;}
    tries++; clearMarks();
    var right=markSlots(slots,function(c,s){return c.dataset.k===s.dataset.exp;});
    if(right===7){
      won=true; lockSlots(slots); var p=pointsFor(tries,[30,20,10]); addPoints(p); S.done.order=true; tabsUpdate();
      say(f.msg,'Masya Allah! All 7 verses are in order. +'+p+' points','ok');
    }else say(f.msg,right+' of 7 are in the right place. Fix the red ones.','bad');
  }));
  f.bar.appendChild(btn('Shuffle again','ghost',render));
}},

fill:{name:'Complete the verse',sub:'Find the missing word',build:function(b){
  var f=scaffold(b,'Complete the verse','Drag the missing word into the gap. A wrong word bounces back.');
  var g=S.g2;
  if(g.i>=ROUNDS.length){
    var r=el('div','result');
    r.appendChild(el('p','big','Well done!'));
    r.appendChild(el('p','','You completed all '+ROUNDS.length+' verses with '+g.miss+(g.miss===1?' wrong word.':' wrong words.')));
    r.appendChild(el('p','','You earned '+g.pts+' points in this round.'));
    f.stage.appendChild(r);
    f.bar.appendChild(btn('Play again','primary',function(){S.g2={i:0,miss:0,pts:0,fin:false}; render();}));
    return;
  }
  var rd=ROUNDS[g.i], v=byN(rd[0]), wi=rd[1], ans=v.w[wi];
  var dots=el('div','dots'); ROUNDS.forEach(function(_,i){dots.appendChild(el('i',i<g.i?'on':''));});
  dots.appendChild(el('span','','Verse '+(g.i+1)+' of '+ROUNDS.length)); f.stage.appendChild(dots);
  var sent=el('div','sentence'); sent.lang='ar'; sent.dir='rtl';
  var gap=el('div','zone slot fit'); gap.tabIndex=0; gap.setAttribute('aria-label','Missing word');
  v.w.forEach(function(w,i){sent.appendChild(i===wi?gap:el('span','',w));});
  f.stage.appendChild(sent);
  var mean=el('p','mean'); mean.appendChild(el('small','',S.lang==='en'?'Meaning':'Maksud')); mean.appendChild(document.createTextNode(v[S.lang]));
  f.stage.appendChild(mean);
  f.stage.appendChild(el('p','lab','Words'));
  var pool=el('div','zone pool');
  var others=[]; V.forEach(function(x){x.w.forEach(function(w){if(v.w.indexOf(w)<0&&others.indexOf(w)<0)others.push(w);});});
  shuffleDiff([ans].concat(shuffle(others).slice(0,3))).forEach(function(w){pool.appendChild(chip(w,{ar:1}));});
  f.stage.appendChild(pool);
  var next=btn(g.i===ROUNDS.length-1?'See results':'Next verse','primary',function(){g.i++; if(g.i>=ROUNDS.length){S.done.fill=true; tabsUpdate();} render();});
  next.hidden=true; f.bar.appendChild(next);
  var m=0;
  S.onchange=function(c,z){
    if(!z.classList.contains('slot'))return;
    if(c.textContent===ans){
      c.classList.add('locked'); z.classList.add('ok'); z.tabIndex=-1;
      var p=m===0?10:5; g.pts+=p; addPoints(p); next.hidden=false; next.focus();
      say(f.msg,'Correct! +'+p+' points','ok');
    }else{
      m++; g.miss++; z.classList.add('bad'); busy=true;
      say(f.msg,'Not that one. Try another word.','bad');
      setTimeout(function(){pool.appendChild(c); z.classList.remove('bad'); busy=false;},650);
    }
  };
}},

match:{name:'Match the meaning',sub:'Pair verse and meaning',build:function(b){
  var f=scaffold(b,'Match the meaning','Drag each meaning next to the verse it explains.');
  f.stage.appendChild(el('p','lab','Verses'));
  var slots=[];
  V.forEach(function(v){
    var row=el('div','mrow'); var vb=el('div','vbox',v.ar); vb.lang='ar'; vb.dir='rtl';
    var s=el('div','zone slot'); s.dataset.exp=v.n; s.tabIndex=0; s.setAttribute('aria-label','Meaning for verse '+v.n);
    slots.push(s); row.appendChild(vb); row.appendChild(s); f.stage.appendChild(row);
  });
  f.stage.appendChild(el('p','lab','Meanings'));
  var pool=el('div','zone pool stack');
  shuffleDiff(V.map(function(v){return v.n;})).forEach(function(n){pool.appendChild(chip(byN(n)[S.lang],{k:n,cls:'text'}));});
  f.stage.appendChild(pool);
  var tries=0, won=false;
  f.bar.appendChild(btn('Check matches','primary',function(){
    if(won)return;
    if(emptyCount(slots)){say(f.msg,'Give every verse a meaning first.','bad'); return;}
    tries++; clearMarks();
    var right=markSlots(slots,function(c,s){return c.dataset.k===s.dataset.exp;});
    if(right===7){
      won=true; lockSlots(slots); var p=pointsFor(tries,[30,20,10]); addPoints(p); S.done.match=true; tabsUpdate();
      say(f.msg,'Masya Allah! Every meaning is matched. +'+p+' points','ok');
    }else say(f.msg,right+' of 7 match. Fix the red ones.','bad');
  }));
  f.bar.appendChild(btn('Shuffle again','ghost',render));
}},

build:{name:'Build the verse',sub:'Assemble the words',build:function(b){
  var f=scaffold(b,'Build the verse','Choose an ayah, then drag its words into place. Words run from right to left, like the verse.');
  var g=S.g4, v=byN(g.n);
  var pick=el('div','pick');
  V.forEach(function(x){
    var p=el('button',g.done[x.n]?'done':'','Ayah '+x.n); p.type='button'; p.setAttribute('aria-pressed',x.n===g.n?'true':'false');
    p.addEventListener('click',function(){g.n=x.n; render();}); pick.appendChild(p);
  });
  f.stage.appendChild(pick);
  f.stage.appendChild(el('p','lab','Your verse'));
  var slotsBox=el('div','build-slots'); var slots=[];
  v.w.forEach(function(w,i){var s=el('div','zone slot fit'); s.dataset.exp=w; s.tabIndex=0; s.setAttribute('aria-label','Word '+(i+1)); slots.push(s); slotsBox.appendChild(s);});
  f.stage.appendChild(slotsBox);
  f.stage.appendChild(el('p','lab','Words'));
  var pool=el('div','zone pool');
  shuffleDiff(v.w).forEach(function(w){pool.appendChild(chip(w,{ar:1}));});
  f.stage.appendChild(pool);
  var tries=0, won=false;
  var nextBtn=btn(g.n<7?'Next ayah':'Back to ayah 1','primary',function(){g.n=g.n<7?g.n+1:1; render();}); nextBtn.hidden=true;
  f.bar.appendChild(btn('Check verse','primary',function(){
    if(won)return;
    if(emptyCount(slots)){say(f.msg,'Place every word first.','bad'); return;}
    tries++; clearMarks();
    var right=markSlots(slots,function(c,s){return c.textContent===s.dataset.exp;});
    if(right===slots.length){
      won=true; lockSlots(slots); var p=pointsFor(tries,[10,5]); addPoints(p);
      g.done[v.n]=true; if(V.every(function(x){return g.done[x.n];})){S.done.build=true;} tabsUpdate();
      pick.children[v.n-1].classList.add('done');
      var mean=el('p','mean'); mean.appendChild(el('small','',S.lang==='en'?'Meaning':'Maksud')); mean.appendChild(document.createTextNode(v[S.lang]));
      f.stage.appendChild(mean); nextBtn.hidden=false;
      say(f.msg,'Masya Allah! Ayah '+v.n+' is complete. +'+p+' points','ok');
    }else say(f.msg,right+' of '+slots.length+' words are right. Fix the red ones.','bad');
  }));
  f.bar.appendChild(btn('Shuffle again','ghost',render));
  f.bar.appendChild(nextBtn);
}}
};

/* ---------- tabs, language, boot ---------- */
var order=['order','fill','match','build'];
function buildTabs(){
  var nav=$('#tabs'); nav.innerHTML='';
  order.forEach(function(k){
    var g=GAMES[k]; var t=el('button','tab'); t.type='button'; t.dataset.k=k;
    t.appendChild(el('b','',g.name)); t.appendChild(el('span','',g.sub));
    var tick=el('em','tick','Done'); tick.hidden=true; t.appendChild(tick);
    t.addEventListener('click',function(){S.game=k; render();});
    nav.appendChild(t);
  });
}
function tabsUpdate(){
  document.querySelectorAll('#tabs .tab').forEach(function(t){
    var k=t.dataset.k; t.setAttribute('aria-pressed',k===S.game?'true':'false');
    t.querySelector('.tick').hidden=!S.done[k];
  });
}
function render(){
  sel=null; busy=false; S.onchange=null;
  var b=$('#board'); b.innerHTML='';
  GAMES[S.game].build(b);
  tabsUpdate();
}
function setLang(l){
  S.lang=l; try{localStorage.setItem('fatihah-lang',l);}catch(e){}
  $('#l-en').setAttribute('aria-pressed',l==='en'?'true':'false');
  $('#l-ms').setAttribute('aria-pressed',l==='ms'?'true':'false');
  if(S.game==='fill'||S.game==='match'||S.game==='build')render();
}
$('#l-en').addEventListener('click',function(){setLang('en');});
$('#l-ms').addEventListener('click',function(){setLang('ms');});
$('#l-en').setAttribute('aria-pressed',S.lang==='en'?'true':'false');
$('#l-ms').setAttribute('aria-pressed',S.lang==='ms'?'true':'false');
buildTabs(); render();
})();
</script>

</body></html>
